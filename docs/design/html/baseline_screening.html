<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

", "secondary-fixed": "#ffdbca", "tertiary": "#006954", "outline": "#71787f" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "margin": "1.25rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "space-sm": "0.5rem", "space-xl": "2.25rem" }, "fontFamily": { "body-md": ["Plus Jakarta Sans"], "urdu-body-lg": ["Noto Nastaliq Urdu"], "label-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "urdu-headline-lg": ["Noto Nastaliq Urdu"], "headline-sm": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "urdu-body-md": ["Noto Nastaliq Urdu"], "body-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "urdu-headline-md": ["Noto Nastaliq Urdu"] }, "fontSize": { "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "urdu-body-lg": ["18px", { "lineHeight": "40px", "fontWeight": "500" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "52px", "fontWeight": "800" }], "urdu-headline-lg": ["26px", { "lineHeight": "54px", "fontWeight": "700" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "urdu-body-md": ["15px", { "lineHeight": "34px", "fontWeight": "400" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "urdu-headline-md": ["22px", { "lineHeight": "48px", "fontWeight": "700" }] } } } };</script><style>

  </head><body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex flex-col"><h1 class="font-headline-sm text-headline-sm text-on-surface line-clamp-1">Baseline check</h1></div></div><div class="flex items-center gap-space-sm"><button aria-label="Bilingual language selector" class="px-space-sm h-9 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center gap-space-xs transition-colors" type="button"><span class="material-symbols-outlined text-primary text-[18px]">translate</span><span class="font-label-sm text-label-sm text-on-surface">اردو / EN</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-lg gap-space-lg">
<!-- Step Progress Indicator -->
<section aria-label="Screening Progress" class="flex flex-col gap-space-xs mt-space-lg">
<div class="flex items-center justify-between"><div class="flex flex-col"><span class="font-label-md text-label-md text-primary font-bold">Task 3 of 10</span><span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Attempt 1 of 3</span></div><span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container px-space-sm py-1 rounded-full">30%</span></div>
<!-- Linear Progress Bar -->
<div class="w-full h-2.5 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 30%;"></div>
</div>
</section>
<!-- Object Prompt Card -->
<section class="w-full bg-surface-container-lowest rounded-lg shadow-sm flex flex-col p-space-lg gap-space-md items-center">
<!-- Everyday Object Image (Apple) -->
<div class="w-full aspect-square max-w-[260px] rounded-DEFAULT bg-surface-container-low flex items-center justify-center overflow-hidden p-space-md">
<img alt="Red apple illustration for vocabulary identification" class="w-full h-full object-contain rounded-DEFAULT" data-alt="A clean, vibrant, high-contrast red apple with a small green leaf on a smooth warm off-white surface. Minimalist, uncluttered composition with gentle studio lighting and soft shadows, ideal for toddler visual recognition in a pediatric speech screening setting." src="../assets/apple.png">
</div>
<!-- Bilingual Prompt Text -->
<div class="flex flex-col items-center text-center gap-space-xs w-full mt-space-xs">
<h2 class="font-headline-sm text-headline-sm text-on-surface font-bold">
        Ask child to name the object
      </h2>

</div>
</section>
<!-- Action Response Buttons -->
<section aria-label="Assessment Response Actions" class="flex flex-col gap-space-sm w-full">
<!-- Primary / Positive Affirmation -->
<button class="w-full min-h-[56px] py-space-sm px-space-md rounded-DEFAULT bg-primary text-on-primary shadow-sm active:scale-[0.99] transition-transform flex items-center justify-between" onclick="handleResponse('said')" type="button"><div class="flex items-center justify-center gap-space-sm w-full"><span class="material-symbols-outlined text-[24px]">check_circle</span><span class="font-label-lg text-label-lg font-bold">Child said it</span></div></button>
<!-- Secondary / Gentle Retrial -->
<button class="w-full min-h-[52px] py-space-sm px-space-md rounded-DEFAULT bg-surface-container text-on-surface active:scale-[0.99] transition-transform flex items-center justify-between" onclick="handleResponse('retry')" type="button"><div class="flex items-center justify-center gap-space-sm w-full"><span class="material-symbols-outlined text-secondary text-[24px]">replay</span><span class="font-label-md text-label-md font-semibold text-on-surface">Try again</span></div></button>
<!-- Tertiary / Skip Neutral Action -->
<button class="w-full min-h-[48px] py-space-xs px-space-md rounded-DEFAULT bg-surface-container-low text-on-surface-variant hover:bg-surface-container active:scale-[0.99] transition-colors flex items-center justify-between" onclick="handleResponse('skip')" type="button"><div class="flex items-center justify-center gap-space-sm w-full"><span class="material-symbols-outlined text-outline text-[20px]">fast_forward</span><span class="font-label-sm text-label-sm font-semibold">Skip</span></div></button>
</section>
<!-- Bottom Link: Save and Continue Later -->
<div class="flex items-center justify-center pt-space-xs pb-space-sm">
<button class="min-h-[48px] px-space-md rounded-full flex items-center gap-space-xs text-primary hover:bg-surface-container transition-colors" onclick="handleSaveSession()" type="button"><span class="material-symbols-outlined text-[20px]">pause_circle</span><span class="font-label-md text-label-md font-semibold">Save and continue later</span></button>
</div>
</div>
<script>
  function handleResponse(actionType) {
    const feedbackToast = document.createElement('div');
    feedbackToast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-space-md py-space-sm rounded-full shadow-lg font-label-sm text-label-sm z-50 flex items-center gap-2 transition-opacity duration-300';
    
    let message = 'Recorded';
    if(actionType === 'said') message = 'Response saved • ٹاسک محفوظ کر لیا گیا';
    if(actionType === 'retry') message = 'Prompt re-queued • دوبارہ کوشش کا انتخاب کیا گیا';
    if(actionType === 'skip') message = 'Task skipped • ٹاسک چھوڑ دیا گیا';

    feedbackToast.textContent = message;
    document.body.appendChild(feedbackToast);

    setTimeout(() => {
      feedbackToast.style.opacity = '0';
      setTimeout(() => feedbackToast.remove(), 300);
    }, 1800);
  }

  function handleSaveSession() {
    const feedbackToast = document.createElement('div');
    feedbackToast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-primary text-on-primary px-space-md py-space-sm rounded-full shadow-lg font-label-sm text-label-sm z-50 flex items-center gap-2';
    feedbackToast.textContent = 'Progress saved • پیش رفت محفوظ ہوگئی';
    document.body.appendChild(feedbackToast);

    setTimeout(() => {
      feedbackToast.style.opacity = '0';
      setTimeout(() => feedbackToast.remove(), 300);
    }, 1800);
  }
</script></main>

</body></html>
