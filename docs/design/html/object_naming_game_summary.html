px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; } .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style></head><body class="bg-surface text-on-surface font-body-md text-body-md select-none touch-manipulation" style="background-color: rgb(255, 248, 240);"><main class="relative w-full min-h-screen bg-surface flex flex-col pt-safe pb-safe pr-safe pl-safe px-margin" style="background-color: rgb(255, 248, 240);"><div class="flex flex-col w-full pb-6 select-none">
<!-- Top Navigation & Stats Bar -->
<div class="flex items-center justify-between w-full pt-1 pb-4">
<!-- Home Navigation Button -->
<button aria-label="Go to Home" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-sm active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-headline-sm" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
<!-- Star Counter Pill -->
<div class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-lowest shadow-sm">
<span class="material-symbols-outlined text-secondary-container text-headline-sm" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-headline-sm text-headline-sm text-on-surface">14</span>
</div>
</div>
<!-- Character Presentation (Directly on canvas, no bounding box) -->
<div class="relative flex flex-col items-center justify-center my-2">
<!-- Ambient soft glow effect -->
<div class="absolute w-36 h-36 rounded-full bg-secondary-fixed/40 blur-xl pointer-events-none"></div>
<img alt="Doctor" class="w-36 h-36 mx-auto object-contain relative z-10 animate-bounce" src="../assets/doctor.png" style="animation-duration: 2.2s; animation-iteration-count: infinite;">
<!-- Animated Sparkle Accents -->

<div class="absolute bottom-2 left-1/4 text-secondary-container">
<span class="material-symbols-outlined text-headline-sm animate-pulse" style="font-variation-settings: 'FILL' 1; animation-delay: 0.7s;">star</span>
</div>
</div>
<!-- Star Reward Arc (5 tactile golden stars) -->
<div class="flex items-center justify-center gap-2.5 my-3">
<!-- Star 1 -->
<div class="w-11 h-11 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center -translate-y-1">
<span class="material-symbols-outlined text-secondary-container text-headline-sm" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<!-- Star 2 -->
<div class="w-12 h-12 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center -translate-y-3">
<span class="material-symbols-outlined text-secondary-container text-headline-md" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<!-- Star 3 (Center Anchor) -->
<div class="w-14 h-14 rounded-full bg-secondary-fixed shadow-md flex items-center justify-center -translate-y-5 scale-110">
<span class="material-symbols-outlined text-secondary text-headline-lg" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<!-- Star 4 -->
<div class="w-12 h-12 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center -translate-y-3">
<span class="material-symbols-outlined text-secondary-container text-headline-md" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<!-- Star 5 -->
<div class="w-11 h-11 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center -translate-y-1">
<span class="material-symbols-outlined text-secondary-container text-headline-sm" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<!-- Celebration Headline & Bilingual Affirmation -->
<div class="flex flex-col items-center text-center px-4 my-2">
<div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-md text-label-md mb-2">
<span class="material-symbols-outlined text-body-md" style="font-variation-settings: 'FILL' 1;">celebration</span>
<span>Super Job!</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
      You named 5 of 6 things!
    </h1>

</div>
<!-- Primary Interactive Actions (Pill-shaped, touch target >= 72dp) -->
<div class="flex flex-col gap-3.5 w-full mt-5 px-1">
<!-- Play Again Button (Mint/Teal therapeutic sanctuary tint) -->
<button class="w-full h-20 min-h-[72px] bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center gap-3 px-6 shadow-md active:translate-y-0.5 active:shadow-sm transition-all duration-150 rounded-full" type="button">
<span class="material-symbols-outlined text-headline-md" style="font-variation-settings: 'FILL' 1;">replay</span>
<span class="font-label-lg text-label-lg font-bold">Play Again</span>
</button>
<!-- Home Button (Warm Peach tint) -->
<button class="w-full h-20 min-h-[72px] bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center gap-3 px-6 shadow-md active:translate-y-0.5 active:shadow-sm transition-all duration-150 rounded-full" type="button">
<span class="material-symbols-outlined text-headline-md" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-lg text-label-lg font-bold">Home</span>
</button>
</div>
<!-- Parental Gate Exit Pill -->
<div class="flex flex-col items-center justify-center mt-7">
<button class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm active:bg-surface-variant transition-colors" id="parentalGateBtn" type="button">
<span class="material-symbols-outlined text-body-sm" style="font-variation-settings: 'FILL' 1;">lock</span>
<span>Grown-ups: hold to exit</span>
</button>
</div>
</div>
<script>
  // Soft tactile hold interaction for parental gate
  const gateBtn = document.getElementById('parentalGateBtn');
  let holdTimeout;

  if (gateBtn) {
    const startHold = () => {
      gateBtn.classList.add('scale-95', 'opacity-80');
      holdTimeout = setTimeout(() => {
        gateBtn.classList.remove('scale-95', 'opacity-80');
        // Gentle adult indicator
        if (navigator.vibrate) navigator.vibrate([40]);
      }, 1200);
    };

    const cancelHold = () => {
      clearTimeout(holdTimeout);
      gateBtn.classList.remove('scale-95', 'opacity-80');
    };

    gateBtn.addEventListener('mousedown', startHold);
    gateBtn.addEventListener('touchstart', startHold, { passive: true });
    gateBtn.addEventListener('mouseup', cancelHold);
    gateBtn.addEventListener('mouseleave', cancelHold);
    gateBtn.addEventListener('touchend', cancelHold);
  }
</script></main>
