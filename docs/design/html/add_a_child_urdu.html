tyle>

  </head><body class="bg-surface font-urdu-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(45,49,66,0.04)]"><div class="min-h-[88px] py-4 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="واپس جائیں" class="w-11 h-11 flex-shrink-0 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="font-urdu-headline-md text-urdu-headline-md text-on-surface mt-1 whitespace-nowrap" style="line-height: 2.2; overflow: visible; display: inline-block; padding: 4px 0px;">بچہ شامل کریں</h1></div><div class="flex items-center gap-space-sm flex-shrink-0"><button aria-label="زبان تبدیل کریں" class="h-11 px-3 flex items-center justify-center rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors"><span class="font-urdu-body-md text-urdu-body-md ml-1">اردو</span><span class="text-outline-variant font-body-sm text-body-sm mx-1">/</span><span class="font-label-md text-label-md">EN</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-24 pb-safe bg-surface"><div class="flex flex-col w-full pb-8" dir="rtl">
<!-- Top Profile Header / Tactile Avatar Card -->
<div class="w-full bg-surface-container-low rounded-lg p-space-lg shadow-sm flex flex-col items-center text-center relative overflow-hidden mb-space-lg">
<div class="absolute -top-12 -left-12 w-32 h-32 rounded-full bg-primary-fixed/20 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-10 -right-10 w-28 h-28 rounded-full bg-secondary-fixed/30 blur-2xl pointer-events-none"></div>
<div class="relative w-24 h-24 mb-space-sm flex items-center justify-center">
<div class="w-24 h-24 rounded-full bg-surface-container-highest shadow-inner flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">face_6</span>
</div>

</div>
<h2 class="font-urdu-headline-md text-urdu-headline-md text-on-surface" style="line-height: 2; padding: 2px 0px;">پروفائل کا نیا اندراج</h2>
<p class="font-urdu-body-md text-urdu-body-md text-on-surface-variant max-w-xs" style="line-height: 2.2; padding: 4px 0px;">بچے کے لیے خصوصی اور پرسکون مشقوں کا سفر شروع کریں</p>
</div>
<!-- Child's Name Input -->
<div class="flex flex-col mb-space-lg">
<label class="font-urdu-body-lg text-urdu-body-lg text-on-surface mb-space-xs font-semibold" for="child-name-input">بچے کا نام</label>
<div class="relative flex items-center">
<input aria-describedby="name-helper-text" class="w-full h-14 bg-surface-container-lowest text-on-surface rounded-DEFAULT px-space-md pl-12 text-right font-urdu-body-lg focus:outline-none focus:bg-surface-container-low shadow-sm transition-all" id="child-name-input" placeholder="مثلاً زید" type="text" style="line-height: 2;">
<div class="absolute left-3.5 flex items-center pointer-events-none text-error">
<span class="material-symbols-outlined text-[22px]">error</span>
</div>
</div>
<p class="flex items-center gap-1.5 font-urdu-body-md text-urdu-body-md text-error mt-1 px-1" id="name-helper-text" style="line-height: 2; padding: 2px 0px;">
<span>براہ کرم بچے کا نام درج کریں</span>
</p>
</div>
<!-- Age Selector -->
<div class="flex flex-col mb-space-lg">
<label class="font-urdu-body-lg text-urdu-body-lg text-on-surface mb-space-sm font-semibold">عمر (سال)</label>
<div aria-label="عمر منتخب کریں" class="grid grid-cols-5 gap-space-sm w-full" role="radiogroup">
<!-- 3 -->
<button aria-checked="false" class="h-14 rounded-DEFAULT bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm hover:bg-surface-container-low active:scale-95 transition-all" role="radio" type="button">
        3
      </button>
<!-- 4 (Selected) -->
<button aria-checked="true" class="h-14 rounded-DEFAULT bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center shadow-md active:scale-95 transition-all" role="radio" type="button">
        4
      </button>
<!-- 5 -->
<button aria-checked="false" class="h-14 rounded-DEFAULT bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm hover:bg-surface-container-low active:scale-95 transition-all" role="radio" type="button">
        5
      </button>
<!-- 6 -->
<button aria-checked="false" class="h-14 rounded-DEFAULT bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm hover:bg-surface-container-low active:scale-95 transition-all" role="radio" type="button">
        6
      </button>
<!-- 7 -->
<button aria-checked="false" class="h-14 rounded-DEFAULT bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm hover:bg-surface-container-low active:scale-95 transition-all" role="radio" type="button">
        7
      </button>
</div>
</div>
<!-- Language Selector -->
<div class="flex flex-col mb-space-xl">
<label class="font-urdu-body-lg text-urdu-body-lg text-on-surface mb-space-sm font-semibold">زبان</label>
<div aria-label="زبان منتخب کریں" class="grid grid-cols-2 gap-space-md w-full" role="radiogroup">
<!-- English Option -->
<button aria-checked="false" class="h-16 px-space-md rounded-DEFAULT bg-surface-container-lowest text-on-surface flex items-center justify-between shadow-sm hover:bg-surface-container-low active:scale-95 transition-all" role="radio" type="button">
<span class="font-label-lg text-label-lg tracking-wide">English</span>
<span class="material-symbols-outlined text-outline text-[24px]">language</span>
</button>
<!-- Urdu Option (Selected) -->
<button aria-checked="true" class="h-16 px-space-md rounded-DEFAULT bg-primary-fixed text-on-primary-fixed-variant flex items-center justify-between shadow-sm active:scale-95 transition-all" role="radio" type="button">
<span class="font-urdu-headline-md text-urdu-headline-md" style="line-height: 2; padding: 2px 0px;">اردو</span>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
</div>
</div>
<!-- Bottom Primary Action Button -->
<button class="w-full h-16 rounded-DEFAULT bg-primary text-on-primary font-urdu-headline-md text-urdu-headline-md flex items-center justify-center gap-space-sm shadow-md hover:bg-primary-container active:scale-98 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="pt-1" style="line-height: 2; padding: 2px 0px;">پروفائل محفوظ کریں</span>
</button>
</div>
<script>
  // Interactive micro-interactions for age and language selections
  document.querySelectorAll('[role="radiogroup"]').forEach((group) => {
    const buttons = group.querySelectorAll('button[role="radio"]');
    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        buttons.forEach((b) => {
          b.setAttribute('aria-checked', 'false');
          if (b.classList.contains('bg-primary')) {
            b.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
            b.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
          }
          if (b.classList.contains('bg-primary-fixed')) {
            b.classList.remove('bg-primary-fixed', 'text-on-primary-fixed-variant');
            b.classList.add('bg-surface-container-lowest', 'text-on-surface');
            const checkBadge = b.querySelector('div');
            if (checkBadge) checkBadge.remove();
          }
        });

        btn.setAttribute('aria-checked', 'true');
        if (group.getAttribute('aria-label') === 'عمر منتخب کریں') {
          btn.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
          btn.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
        } else {
          btn.classList.remove('bg-surface-container-lowest', 'text-on-surface');
          btn.classList.add('bg-primary-fixed', 'text-on-primary-fixed-variant');
          if (!btn.querySelector('.bg-primary')) {
            const check = document.createElement('div');
            check.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm';
            check.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span>';
            btn.appendChild(check);
          }
        }
      });
    });
  });
</script></main>

</body></html>
