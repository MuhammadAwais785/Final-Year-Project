u"], "urdu-headline-md": ["Noto Nastaliq Urdu"], "label-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "urdu-body-lg": ["Noto Nastaliq Urdu"], "body-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "urdu-headline-lg": ["Noto Nastaliq Urdu"], "headline-lg": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"] }, fontSize: { "urdu-body-md": ["15px", { "lineHeight": "34px", "fontWeight": "400" }], "urdu-headline-md": ["22px", { "lineHeight": "48px", "fontWeight": "700" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "52px", "fontWeight": "800" }], "urdu-body-lg": ["18px", { "lineHeight": "40px", "fontWeight": "500" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "urdu-headline-lg": ["26px", { "lineHeight": "54px", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } }</script><style>@layer base { html, body { width: 100vw; min-height: 100%; margin: 0; padding: 0; } body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } .pr-safe { padding-right: env(safe-area-inset-right, 0px); } .pl-safe { padding-left: env(safe-area-inset-left, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; } .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style></head><body class="bg-surface text-on-surface font-body-md text-body-md select-none touch-manipulation" style="background-color: rgb(255, 248, 240);"><main class="relative w-full min-h-screen bg-surface flex flex-col pt-safe pb-safe pr-safe pl-safe px-margin" style="background-color: rgb(255, 248, 240);"><div class="flex flex-col w-full pb-6 select-none" style="background-color: #FFF8F0; min-height: 100%;">
<!-- Top Navigation Bar -->
<div class="flex items-center justify-between w-full px-4 pt-2 pb-3">
<!-- Home Button (Touch target >= 48dp) -->
<button aria-label="Home" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-sm active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[28px] text-primary">home</span>
</button>
<!-- Center: 6 Progress Dots -->
<div class="flex items-center space-x-2 px-3 py-2 bg-surface-container-lowest/60 rounded-full shadow-sm"><span class="w-3.5 h-3.5 rounded-full bg-[#3D7EA6]"></span><span class="w-3.5 h-3.5 rounded-full bg-[#3D7EA6]"></span><span class="w-3.5 h-3.5 rounded-full bg-[#A8DADC]/40"></span><span class="w-3.5 h-3.5 rounded-full bg-[#A8DADC]/40"></span><span class="w-3.5 h-3.5 rounded-full bg-[#A8DADC]/40"></span><span class="w-3.5 h-3.5 rounded-full bg-[#A8DADC]/40"></span></div>
<!-- Star Counter Pill (Single star icon and '12') -->
<div class="flex items-center space-x-1.5 h-12 px-4 rounded-full bg-surface-container-lowest shadow-sm"><span class="material-symbols-outlined text-[24px] text-secondary-container" style="font-variation-settings: &quot;FILL&quot; 1;">star</span><span class="font-headline-sm text-headline-sm text-on-surface leading-none">12</span></div>
</div>
<!-- Main Card Container -->
<div class="px-4 mt-2">
<div class="w-full flex flex-col items-center justify-center text-center py-4 relative"><button aria-label="Replay audio" class="absolute top-2 right-2 w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest text-primary shadow-sm active:scale-95 transition-transform z-10" type="button"><span class="material-symbols-outlined text-[24px]">volume_up</span></button><div class="w-48 h-48 mx-auto flex items-center justify-center mb-2"><img alt="apple" class="w-48 h-48 mx-auto object-contain" src="../assets/apple.png"></div><h1 class="font-display-lg-mobile text-display-lg-mobile font-bold tracking-tight text-[#1E293B] lowercase mb-1">apple</h1><p class="font-body-md text-body-md text-[#1E293B]/70" dir="rtl">سیب</p></div>
</div>
<!-- Interactive Microphone Area (Listening...) -->
<div class="px-4 mt-5">
<div class="w-full h-20 min-h-[72px] bg-surface-container-lowest rounded-full shadow-md flex items-center justify-between px-4 sm:px-6">
<!-- Pulsing Mic Node -->
<div class="relative flex items-center justify-center w-14 h-14">
<span class="absolute inset-0 rounded-full bg-primary-fixed animate-ping opacity-60"></span>
<div class="relative w-14 h-14 rounded-full bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[30px] text-on-primary" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<!-- Animated Sound Waveform -->
<div class="flex items-center space-x-1.5 h-8 px-2 flex-1 max-w-[120px] justify-center"><span class="w-1 h-3 rounded-full bg-[#3D7EA6]/60"></span><span class="w-1 h-5 rounded-full bg-[#3D7EA6]"></span><span class="w-1 h-7 rounded-full bg-primary"></span><span class="w-1 h-4 rounded-full bg-[#3D7EA6]"></span><span class="w-1 h-6 rounded-full bg-primary"></span><span class="w-1 h-3 rounded-full bg-[#3D7EA6]/60"></span></div>
<!-- Status Label -->
<div class="flex items-center pr-2">
<span class="font-headline-sm text-headline-sm text-[#1E293B]">Listening…</span>
</div>
</div>
</div>
<!-- Therapeutic Guide Companion Area -->
<div class="px-6 mt-4 flex items-end justify-start space-x-3">
<!-- Doctor Character -->
<div class="flex-shrink-0">
<img alt="Doctor" class="w-20 h-20 object-contain mix-blend-multiply" src="../assets/doctor.png">
</div>
<!-- Speech Bubble with Tail Pointing to Character -->
<div class="relative mb-2 bg-surface-container-lowest text-on-surface shadow-sm rounded-2xl px-4 py-2.5 max-w-[200px]">
<p class="font-body-lg text-body-lg text-[#1E293B]">What is this?</p>
<!-- Speech Bubble Tail -->
<div class="absolute -left-2 bottom-3 w-0 h-0 border-t-[8px] border-t-transparent border-r-[10px] border-r-surface-container-lowest border-b-[8px] border-b-transparent"></div>
</div>
</div>
<!-- Bottom Parental Exit Button -->
<div class="w-full px-4 mt-auto pt-6 flex justify-center">
<button aria-label="Grown-ups: hold to exit" class="flex items-center space-x-2 px-5 py-2.5 rounded-full bg-surface-container-high/80 text-on-surface-variant active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">lock</span>
<span class="font-label-sm text-label-sm">Grown-ups: hold to exit</span>
</button>
</div>
</div></main>
