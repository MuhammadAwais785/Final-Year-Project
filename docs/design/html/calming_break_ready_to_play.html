<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#FFF8F0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "cream": "#FFF8F0", "surface-container-lowest": "#ffffff", "on-tertiary-fixed": "#002018", "tertiary": "#006954", "secondary": "#944a1a", "inverse-primary": "#90cef9", "on-primary-container": "#fcfcff", "primary": "#186288", "on-error": "#ffffff", "on-tertiary-container": "#f5fff9", "surface-variant": "#dee1f8", "on-primary-fixed-variant": "#004c6d", "inverse-on-surface": "#eff0ff", "on-secondary-fixed": "#331200", "primary-fixed-dim": "#90cef9", "surface-dim": "#d6d9ef", "on-secondary": "#ffffff", "on-surface-variant": "#40484e", "surface": "#faf8ff", "outline": "#71787f", "surface-container-high": "#e4e7fe", "on-secondary-fixed-variant": "#763302", "on-secondary-container": "#773403", "on-primary-fixed": "#001e2e", "on-surface": "#171b2b", "primary-container": "#397ba3", "background": "#FFF8F0", "inverse-surface": "#2c3041", "on-error-container": "#93000a", "on-tertiary": "#ffffff", "tertiary-fixed": "#99f4d7", "surface-bright": "#faf8ff", "secondary-fixed": "#ffdbca", "surface-container": "#ebedff", "on-background": "#171b2b", "surface-container-highest": "#dee1f8", "primary-fixed": "#c8e6ff", "tertiary-container": "#1f836b", "secondary-fixed-dim": "#ffb68e", "error-container": "#ffdad6", "secondary-container": "#fe9e67", "on-primary": "#ffffff", "surface-container-low": "#f3f2ff", "outline-variant": "#c0c7cf", "on-tertiary-fixed-variant": "#005140", "error": "#ba1a1a", "tertiary-fixed-dim": "#7dd7bc", "surface-tint": "#1c648b" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "gutter": "1rem", "space-xs": "0.25rem", "margin": "1.25rem", "space-xl": "2.25rem", "space-lg": "1.5rem", "space-sm": "0.5rem" }, "fontFamily": { "urdu-body-md": ["Noto Nastaliq Urdu"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "urdu-body-lg": ["Noto Nastaliq Urdu"], "label-lg": ["Plus Jakarta Sans"], "urdu-headline-md": ["Noto Nastaliq Urdu"], "body-sm": ["Plus Jakarta Sans"], "urdu-headline-lg": ["Noto Nastaliq Urdu"], "body-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"] }, "fontSize": { "urdu-body-md": ["15px", { "lineHeight": "34px", "fontWeight": "400" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "52px", "fontWeight": "800" }], "urdu-body-lg": ["18px", { "lineHeight": "40px", "fontWeight": "500" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "urdu-headline-md": ["22px", { "lineHeight": "48px", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "urdu-headline-lg": ["26px", { "lineHeight": "54px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }] } } } }</script></head><body class="min-h-screen text-on-surface antialiased flex flex-col selection:bg-secondary-fixed bg-[#FFF8F0]" style="background-color: rgb(255, 248, 240);"><main class="flex-1 flex flex-col justify-between relative w-full pt-safe pb-safe bg-[#FFF8F0]" style="background-color: #FFF8F0;"><div class="flex-1 flex flex-col items-center justify-center w-full px-margin py-space-lg">
<!-- Main Welcoming Content Area -->
<div class="flex flex-col items-center justify-center w-full text-center max-w-sm mx-auto">
<!-- Gentle Speech Bubble Prompt -->
<div class="relative bg-white px-7 py-3 rounded-2xl shadow-sm border border-slate-100/60 max-w-[280px] mb-2">
<p class="font-headline-sm text-[20px] font-bold text-slate-800 leading-snug">Ready to play again?</p>
<!-- Soft downward speech bubble tail pointing to the Doctor character -->
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-white border-b border-r border-slate-100/60 rotate-45 rounded-xs"></div>
</div>
<!-- Isolated Friendly Doctor Character: directly on cream background, NO grey box, white card, border, or frame -->
<div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2">
<img alt="Friendly doctor welcoming child back from break" class="w-full h-full object-contain pointer-events-none select-none" src="../assets/doctor.png">
</div>
<!-- Cheerful Big Touch-Target Play Button: Rounded-full pill with gentle mint/cyan/sky accent -->
<div class="w-full max-w-xs mt-3">
<button class="w-full min-h-[64px] py-4 px-space-lg bg-[#99F4D7] hover:bg-[#83ebd0] active:scale-[0.98] text-[#004A3B] font-headline-sm text-headline-sm rounded-full shadow-sm transition-all flex items-center justify-center gap-2" id="play-again-btn" type="button">
<span>Play again</span>
</button>
</div>
</div>
</div>
<!-- Calm Parental Controls at Bottom: ONLY ONE exit control -->
<div class="w-full flex flex-col items-center pb-6">
<div class="relative select-none">
<button class="inline-flex items-center gap-1.5 text-slate-500 hover:text-slate-700 font-label-sm text-label-sm py-2 px-5 rounded-full bg-slate-200/50 hover:bg-slate-200/70 active:bg-slate-200 transition-all" id="hold-exit-btn" type="button">
<span class="material-symbols-outlined text-[17px]">lock</span>
<span>Grown-ups: hold to exit</span>
</button>
<!-- Discreet holding progress meter -->
<div class="absolute inset-0 rounded-full bg-slate-300/60 scale-x-0 origin-left transition-transform duration-1000 pointer-events-none opacity-0" id="hold-indicator"></div>
</div>
</div>
<script>
  (function () {
    const holdBtn = document.getElementById('hold-exit-btn');
    const indicator = document.getElementById('hold-indicator');
    let timer = null;

    if (holdBtn && indicator) {
      const startHold = () => {
        indicator.classList.remove('opacity-0');
        indicator.classList.add('opacity-100');
        indicator.style.transform = 'scaleX(1)';
        timer = setTimeout(() => {
          indicator.style.transform = 'scaleX(0)';
          indicator.classList.add('opacity-0');
        }, 1000);
      };

      const cancelHold = () => {
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }
        indicator.style.transform = 'scaleX(0)';
        indicator.classList.remove('opacity-100');
        indicator.classList.add('opacity-0');
      };

      holdBtn.addEventListener('mousedown', startHold);
      holdBtn.addEventListener('mouseup', cancelHold);
      holdBtn.addEventListener('mouseleave', cancelHold);
      holdBtn.addEventListener('touchstart', startHold, { passive: true });
      holdBtn.addEventListener('touchend', cancelHold);
      holdBtn.addEventListener('touchcancel', cancelHold);
    }
  })();
</script></main>

</body></html>
