<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#FFF8F0;}body{overscroll-behavior:none;background-color:#FFF8F0;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-lowest": "#ffffff", "on-tertiary-fixed": "#002018", "tertiary": "#006954", "secondary": "#944a1a", "inverse-primary": "#90cef9", "on-primary-container": "#fcfcff", "primary": "#186288", "on-error": "#ffffff", "on-tertiary-container": "#f5fff9", "surface-variant": "#dee1f8", "on-primary-fixed-variant": "#004c6d", "inverse-on-surface": "#eff0ff", "on-secondary-fixed": "#331200", "primary-fixed-dim": "#90cef9", "surface-dim": "#d6d9ef", "on-secondary": "#ffffff", "on-surface-variant": "#40484e", "surface": "#FFF8F0", "outline": "#71787f", "surface-container-high": "#e4e7fe", "on-secondary-fixed-variant": "#763302", "on-secondary-container": "#773403", "on-primary-fixed": "#001e2e", "on-surface": "#171b2b", "primary-container": "#397ba3", "background": "#FFF8F0", "inverse-surface": "#2c3041", "on-error-container": "#93000a", "on-tertiary": "#ffffff", "tertiary-fixed": "#99f4d7", "surface-bright": "#FFF8F0", "secondary-fixed": "#ffdbca", "surface-container": "#ebedff", "on-background": "#171b2b", "surface-container-highest": "#dee1f8", "primary-fixed": "#c8e6ff", "tertiary-container": "#1f836b", "secondary-fixed-dim": "#ffb68e", "error-container": "#ffdad6", "secondary-container": "#fe9e67", "on-primary": "#ffffff", "surface-container-low": "#f3f2ff", "outline-variant": "#c0c7cf", "on-tertiary-fixed-variant": "#005140", "error": "#ba1a1a", "tertiary-fixed-dim": "#7dd7bc", "surface-tint": "#1c648b" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "gutter": "1rem", "space-xs": "0.25rem", "margin": "1.25rem", "space-xl": "2.25rem", "space-lg": "1.5rem", "space-sm": "0.5rem" }, "fontFamily": { "urdu-body-md": ["Noto Nastaliq Urdu"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "urdu-body-lg": ["Noto Nastaliq Urdu"], "label-lg": ["Plus Jakarta Sans"], "urdu-headline-md": ["Noto Nastaliq Urdu"], "body-sm": ["Plus Jakarta Sans"], "urdu-headline-lg": ["Noto Nastaliq Urdu"], "body-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"] }, "fontSize": { "urdu-body-md": ["15px", { "lineHeight": "34px", "fontWeight": "400" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "52px", "fontWeight": "800" }], "urdu-body-lg": ["18px", { "lineHeight": "40px", "fontWeight": "500" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "urdu-headline-md": ["22px", { "lineHeight": "48px", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "urdu-headline-lg": ["26px", { "lineHeight": "54px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }] } } } }</script></head><body class="min-h-screen text-on-surface antialiased flex flex-col selection:bg-secondary-fixed" style="background-color: rgb(255, 248, 240);"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe min-h-screen" style="background-color: #FFF8F0;"><div class="flex flex-col w-full px-margin pb-space-lg flex-1 justify-between">
<!-- Top Section: Header & Sound Cards -->
<div class="flex flex-col w-full">
<!-- Soothing Headline Prompt -->
<section class="mt-space-lg mb-space-lg text-center flex flex-col items-center">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight font-bold">Soothing sounds</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mt-space-xs">
      Touch a tile to hear quiet nature whisper.
    </p>
</section>
<!-- Interactive Sound Cards Grid -->
<section aria-label="Select soothing sound" class="flex flex-col gap-space-md w-full" id="sound-cards-group" role="radiogroup">
<!-- Tile 1: Rain (Soft Lavender accent) -->
<button aria-checked="true" class="sound-card group relative flex items-center justify-between p-space-md min-h-[84px] rounded-lg bg-[#E2E5F8] text-on-surface shadow-[0_4px_16px_rgba(45,49,66,0.06)] transition-all duration-300 scale-[1.01] text-left" data-sound="rain" role="radio" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="w-14 h-14 rounded-full bg-white flex items-center justify-center shrink-0 shadow-[0_2px_8px_rgba(45,49,66,0.06)]">
<span class="material-symbols-outlined text-[#186288] text-[30px]">rainy</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-semibold">Rain</span>
</div>
<div class="w-12 h-12 rounded-full bg-[#186288] text-white flex items-center justify-center shrink-0 shadow-[0_4px_12px_rgba(24,98,136,0.25)]">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</div>
<div class="active-glow absolute inset-0 rounded-lg bg-primary/10 pointer-events-none animate-pulse"></div>
</button>
<!-- Tile 2: Birds (Sky-blue accent) -->
<button aria-checked="false" class="sound-card group relative flex items-center justify-between p-space-md min-h-[84px] rounded-lg bg-[#D4E8FC] text-on-surface shadow-[0_2px_12px_rgba(45,49,66,0.04)] transition-all duration-300 text-left hover:scale-[1.01]" data-sound="birds" role="radio" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="w-14 h-14 rounded-full bg-white flex items-center justify-center shrink-0 shadow-[0_2px_8px_rgba(45,49,66,0.06)]">
<span class="material-symbols-outlined text-[#186288] text-[30px]">cruelty_free</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-semibold">Birds</span>
</div>
<div class="w-12 h-12 rounded-full bg-white text-on-surface-variant flex items-center justify-center shrink-0 shadow-[0_2px_8px_rgba(45,49,66,0.04)]">
<span class="material-symbols-outlined text-[24px]">play_arrow</span>
</div>
<div class="active-glow absolute inset-0 rounded-lg bg-primary/10 pointer-events-none hidden"></div>
</button>
<!-- Tile 3: Ocean waves (Gentle mint accent) -->
<button aria-checked="false" class="sound-card group relative flex items-center justify-between p-space-md min-h-[84px] rounded-lg bg-[#CEF2E5] text-on-surface shadow-[0_2px_12px_rgba(45,49,66,0.04)] transition-all duration-300 text-left hover:scale-[1.01]" data-sound="waves" role="radio" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="w-14 h-14 rounded-full bg-white flex items-center justify-center shrink-0 shadow-[0_2px_8px_rgba(45,49,66,0.06)]">
<span class="material-symbols-outlined text-[#006954] text-[30px]">waves</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-semibold">Ocean waves</span>
</div>
<div class="w-12 h-12 rounded-full bg-white text-on-surface-variant flex items-center justify-center shrink-0 shadow-[0_2px_8px_rgba(45,49,66,0.04)]">
<span class="material-symbols-outlined text-[24px]">play_arrow</span>
</div>
<div class="active-glow absolute inset-0 rounded-lg bg-primary/10 pointer-events-none hidden"></div>
</button>
</section>
</div>
<!-- Bottom Section: Doctor Illustration & Exit Button -->
<div class="flex flex-col items-center w-full mt-space-md">
<!-- Doctor Character placed directly on cream background -->
<section class="relative w-full flex items-end justify-center mb-space-sm">
<!-- Gentle Speech Bubble -->
<div class="absolute -top-3 right-6 z-10 max-w-[190px] px-3.5 py-2 bg-white rounded-DEFAULT shadow-[0_4px_16px_rgba(45,49,66,0.08)]">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-tertiary text-[18px]">favorite</span>
<p class="font-label-sm text-label-sm text-on-surface">Breathe deep and listen...</p>
</div>
<div class="absolute -bottom-1.5 right-8 w-3 h-3 bg-white rotate-45 shadow-[2px_2px_4px_rgba(45,49,66,0.04)]"></div>
</div>
<!-- Isolated Doctor Character -->
<div class="relative w-48 h-48 flex items-center justify-center">
<img alt="Doctor character resting" class="w-full h-full object-contain pointer-events-none select-none drop-shadow-[0_8px_20px_rgba(45,49,66,0.06)]" src="../assets/doctor.png">
</div>
</section>
<!-- Parental Exit Button (Only Exit Control) -->
<footer class="w-full flex justify-center mb-space-xs">
<button class="relative group flex items-center gap-space-xs px-space-lg py-2.5 rounded-full bg-surface-container text-on-surface-variant shadow-[0_2px_8px_rgba(45,49,66,0.05)] active:scale-95 transition-transform overflow-hidden" id="parental-exit-btn" type="button">
<span class="material-symbols-outlined text-[18px] text-secondary">lock</span>
<span class="font-label-sm text-label-sm select-none text-on-surface font-medium">Grown-ups: hold to exit</span>
<div class="absolute inset-0 bg-secondary-fixed/50 transform -translate-x-full transition-transform duration-75 pointer-events-none" id="hold-progress"></div>
</button>
</footer>
</div>
</div>
<script>
  (function() {
    const cards = document.querySelectorAll('.sound-card');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('scale-[1.01]', 'shadow-[0_4px_16px_rgba(45,49,66,0.06)]');
          c.classList.add('shadow-[0_2px_12px_rgba(45,49,66,0.04)]');
          
          const glow = c.querySelector('.active-glow');
          if (glow) {
            glow.classList.add('hidden');
            glow.classList.remove('animate-pulse');
          }

          const actionBtn = c.querySelector('div:last-of-type');
          if (actionBtn && !actionBtn.classList.contains('active-glow')) {
            actionBtn.className = 'w-12 h-12 rounded-full bg-white text-on-surface-variant flex items-center justify-center shrink-0 shadow-[0_2px_8px_rgba(45,49,66,0.04)]';
            actionBtn.innerHTML = '<span class="material-symbols-outlined text-[24px]">play_arrow</span>';
          }
        });

        // Set active clicked card
        card.setAttribute('aria-checked', 'true');
        card.classList.add('scale-[1.01]', 'shadow-[0_4px_16px_rgba(45,49,66,0.06)]');
        card.classList.remove('shadow-[0_2px_12px_rgba(45,49,66,0.04)]');

        const glow = card.querySelector('.active-glow');
        if (glow) {
          glow.classList.remove('hidden');
          glow.classList.add('animate-pulse');
        }

        const actionBtn = card.querySelector('div:last-of-type');
        if (actionBtn && !actionBtn.classList.contains('active-glow')) {
          actionBtn.className = 'w-12 h-12 rounded-full bg-[#186288] text-white flex items-center justify-center shrink-0 shadow-[0_4px_12px_rgba(24,98,136,0.25)]';
          actionBtn.innerHTML = '<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: \'FILL\' 1;">volume_up</span>';
        }
      });
    });

    // Hold to exit simulation
    const holdBtn = document.getElementById('parental-exit-btn');
    const holdProgress = document.getElementById('hold-progress');
    let holdTimeout;

    function startHold() {
      holdProgress.style.transition = 'transform 1.2s cubic-bezier(0.1, 0.7, 0.1, 1)';
      holdProgress.style.transform = 'translateX(0%)';

      holdTimeout = setTimeout(() => {
        resetHold();
      }, 1200);
    }

    function resetHold() {
      clearTimeout(holdTimeout);
      holdProgress.style.transition = 'transform 0.2s ease-out';
      holdProgress.style.transform = 'translateX(-100%)';
    }

    if (holdBtn) {
      holdBtn.addEventListener('mousedown', startHold);
      holdBtn.addEventListener('mouseup', resetHold);
      holdBtn.addEventListener('mouseleave', resetHold);
      holdBtn.addEventListener('touchstart', startHold, { passive: true });
      holdBtn.addEventListener('touchend', resetHold);
    }
  })();
</script></main>

</body></html>
