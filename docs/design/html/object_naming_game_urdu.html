<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#7dd7bc", "inverse-primary": "#90cef9", "secondary-fixed": "#ffdbca", "on-error": "#ffffff", "on-tertiary-fixed-variant": "#005140", "inverse-on-surface": "#eff0ff", "surface-container-high": "#e4e7fe", "primary-fixed": "#c8e6ff", "surface-container-lowest": "#ffffff", "outline": "#71787f", "on-tertiary-fixed": "#002018", "on-secondary-fixed-variant": "#763302", "on-primary-fixed": "#001e2e", "on-background": "#171b2b", "on-primary-fixed-variant": "#004c6d", "on-primary-container": "#fcfcff", "tertiary": "#006954", "surface": "#faf8ff", "primary-fixed-dim": "#90cef9", "secondary-fixed-dim": "#ffb68e", "primary-container": "#397ba3", "on-surface": "#171b2b", "secondary-container": "#fe9e67", "outline-variant": "#c0c7cf", "tertiary-fixed": "#99f4d7", "on-tertiary-container": "#f5fff9", "error": "#ba1a1a", "surface-variant": "#dee1f8", "surface-container-highest": "#dee1f8", "surface-dim": "#d6d9ef", "on-primary": "#ffffff", "on-secondary-container": "#773403", "tertiary-container": "#1f836b", "background": "#faf8ff", "on-secondary": "#ffffff", "inverse-surface": "#2c3041", "surface-tint": "#1c648b", "surface-bright": "#faf8ff", "on-surface-variant": "#40484e", "error-container": "#ffdad6", "secondary": "#944a1a", "on-secondary-fixed": "#331200", "primary": "#186288", "surface-container": "#ebedff", "surface-container-low": "#f3f2ff", "on-error-container": "#93000a" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-md": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "space-xl": "2.25rem", "space-sm": "0.5rem", "margin": "1.25rem" }, fontFamily: { "urdu-body-md": ["Noto Nastaliq Urdu"], "urdu-headline-md": ["Noto Nastaliq Urdu"], "label-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "urdu-body-lg": ["Noto Nastaliq Urdu"], "body-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "urdu-headline-lg": ["Noto Nastaliq Urdu"], "headline-lg": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"] }, fontSize: { "urdu-body-md": ["15px", { "lineHeight": "34px", "fontWeight": "400" }], "urdu-headline-md": ["22px", { "lineHeight": "48px", "fontWeight": "700" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "52px", "fontWeight": "800" }], "urdu-body-lg": ["18px", { "lineHeight": "40px", "fontWeight": "500" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "urdu-headline-lg": ["26px", { "lineHeight": "54px", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } }</script><style>@layer base { html, body { width: 100vw; min-height: 100%; margin: 0; padding: 0; } body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } .pr-safe { padding-right: env(safe-area-inset-right, 0px); } .pl-safe { padding-left: env(safe-area-inset-left, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; } .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style></head><body class="bg-surface text-on-surface font-body-md text-body-md select-none touch-manipulation" style="background-color: rgb(255, 248, 240);"><main class="relative w-full min-h-screen bg-surface flex flex-col pt-safe pb-safe pr-safe pl-safe px-margin" style="background-color: rgb(255, 248, 240);"><div class="flex flex-col w-full min-w-0" dir="rtl">
<!-- Top Bar: Mirrored RTL layout -->
<header class="flex items-center justify-between w-full py-space-sm px-space-xs">
<!-- Right side in RTL: Home Button (>= 48dp, child friendly 56dp) -->
<button aria-label="گھر واپس جائیں" class="w-14 h-14 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-headline-md" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
<!-- Center: 6 progress dots (mirrored: right-to-left 2 filled with primary color) -->
<div aria-label="پیش رفت 2 از 6" class="flex items-center gap-space-xs">
<div class="w-3.5 h-3.5 rounded-full bg-primary shadow-sm transition-all duration-300"></div>
<div class="w-3.5 h-3.5 rounded-full bg-primary shadow-sm transition-all duration-300"></div>
<div class="w-3 h-3 rounded-full bg-surface-variant transition-all duration-300"></div>
<div class="w-3 h-3 rounded-full bg-surface-variant transition-all duration-300"></div>
<div class="w-3 h-3 rounded-full bg-surface-variant transition-all duration-300"></div>
<div class="w-3 h-3 rounded-full bg-surface-variant transition-all duration-300"></div>
</div>
<!-- Left side in RTL: Star counter with 1 star icon and Western digits "12" -->
<div class="h-14 px-space-md rounded-full bg-surface-container-lowest shadow-sm flex flex-row items-center justify-center gap-space-xs text-on-surface shrink-0">
<span class="material-symbols-outlined text-secondary-container shrink-0" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-normal select-none leading-none shrink-0">12</span>
</div>
</header>
<!-- Main Focus Interactive Island Card (White pillow card) -->
<section class="mt-space-md w-full bg-surface-container-lowest rounded-xl shadow-md p-space-lg flex flex-col items-center relative overflow-hidden">
<!-- Replayable Phoneme Sound Trigger Button (Top corner) -->
<div class="w-full flex justify-start mb-space-xs">
<button aria-label="تلفظ سنیں" class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary shadow-sm active:scale-90 transition-transform" id="pronounce-btn" type="button">
<span class="material-symbols-outlined text-headline-sm" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
<!-- Apple Object Card Graphic -->
<div class="relative w-48 h-48 mx-auto flex items-center justify-center">
<img alt="apple" class="w-48 h-48 mx-auto object-contain drop-shadow-sm select-none" src="../assets/apple.png">
</div>
<!-- Urdu & English Typography Badges -->
<div class="text-center mt-space-sm flex flex-col items-center">
<h1 class="font-urdu-headline-lg text-[40px] leading-[72px] font-bold text-on-surface select-none">
        سیب
      </h1>
<span class="font-label-lg text-label-lg text-outline font-semibold tracking-wide select-none lowercase">
        apple
      </span>
</div>
</section>
<!-- Large Interactive Sound/Microphone Node (Child Target >= 80dp) -->
<section class="mt-space-lg flex flex-col items-center justify-center">
<!-- Central Pulsing Audio Recorder Node -->
<div class="relative flex items-center justify-center">
<!-- Ambient Breathing Aura Rings -->
<div class="absolute w-28 h-28 rounded-full bg-primary-fixed-dim/40 animate-ping opacity-75 pointer-events-none"></div>
<div class="absolute w-24 h-24 rounded-full bg-primary-fixed/60 pointer-events-none"></div>
<!-- Core Microphone Button (80dp x 80dp) -->
<button aria-label="آواز ریکارڈ کریں" class="relative z-10 w-20 h-20 rounded-full bg-primary text-on-primary shadow-xl flex items-center justify-center active:scale-95 transition-transform duration-150" id="mic-node" type="button">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Live Animated Waveform Ribbon -->
<div class="flex items-center gap-1.5 h-8 mt-space-md px-space-md py-space-xs rounded-full bg-surface-container-low">
<span class="w-1.5 bg-primary rounded-full animate-pulse h-3"></span>
<span class="w-1.5 bg-primary rounded-full animate-pulse h-6" style="animation-delay: 150ms;"></span>
<span class="w-1.5 bg-primary rounded-full animate-pulse h-4" style="animation-delay: 300ms;"></span>
<span class="w-1.5 bg-primary rounded-full animate-pulse h-7" style="animation-delay: 75ms;"></span>
<span class="w-1.5 bg-primary rounded-full animate-pulse h-5" style="animation-delay: 220ms;"></span>
<span class="w-1.5 bg-primary rounded-full animate-pulse h-3" style="animation-delay: 400ms;"></span>
</div>
<!-- Urdu State Label: Listening... -->
<span class="font-urdu-body-md text-urdu-body-md text-on-surface-variant font-medium mt-space-xs select-none">
      سن رہے ہیں…
    </span>
</section>
<!-- Doctor Guide Character + Mirrored Speech Bubble (Bottom Area) -->
<section class="mt-space-md flex items-end justify-center gap-space-sm px-space-xs">
<!-- Speech Bubble pointing to the Doctor in RTL -->
<div class="relative bg-surface-container-lowest shadow-sm rounded-lg px-space-lg py-space-xs mb-space-sm flex items-center">
<p class="font-urdu-headline-md text-urdu-headline-md text-on-surface font-bold text-center m-0">
        یہ کیا ہے؟
      </p>
<!-- RTL Chat Bubble Tail (Pointing to the left towards doctor) -->
<div class="absolute -left-2.5 bottom-4 w-0 h-0 border-t-[8px] border-t-transparent border-r-[12px] border-r-surface-container-lowest border-b-[8px] border-b-transparent"></div>
</div>
<!-- Doctor sitting directly on canvas with NO background box -->
<div class="w-20 h-20 shrink-0 flex items-center justify-center">
<img alt="Doctor" class="w-20 h-20 object-contain mix-blend-multiply select-none pointer-events-none" src="../assets/doctor.png">
</div>
</section>
<!-- Bottom Parental Safety Exit Pill Button -->
<div class="mt-space-lg mb-space-sm flex justify-center w-full">
<button class="h-12 px-space-lg rounded-full bg-surface-container shadow-sm flex items-center justify-center gap-space-xs text-on-surface-variant active:bg-surface-variant transition-colors select-none" id="parental-gate-exit" type="button">
<span class="material-symbols-outlined text-body-lg text-outline">lock</span>
<span class="font-urdu-body-md text-urdu-body-md leading-none text-on-surface-variant pt-1 font-medium">
        والدین: باہر نکلنے کے لیے دبا کر رکھیں
      </span>
</button>
</div>
</div>
<script>
  // Soft tactile haptic response on interactive touch nodes
  const micNode = document.getElementById('mic-node');
  const soundBtn = document.getElementById('pronounce-btn');
  const exitBtn = document.getElementById('parental-gate-exit');

  if (micNode) {
    micNode.addEventListener('touchstart', () => {
      if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(20);
    });
  }

  if (soundBtn) {
    soundBtn.addEventListener('click', () => {
      soundBtn.classList.add('scale-110');
      setTimeout(() => soundBtn.classList.remove('scale-110'), 200);
    });
  }

  // Press-and-hold requirement simulation for Parental Gate Exit
  let holdTimer;
  if (exitBtn) {
    exitBtn.addEventListener('mousedown', startHold);
    exitBtn.addEventListener('touchstart', startHold);
    exitBtn.addEventListener('mouseup', endHold);
    exitBtn.addEventListener('mouseleave', endHold);
    exitBtn.addEventListener('touchend', endHold);
  }

  function startHold() {
    exitBtn.classList.add('opacity-75');
    holdTimer = setTimeout(() => {
      if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([40, 60, 40]);
      exitBtn.classList.remove('opacity-75');
    }, 1500);
  }

  function endHold() {
    clearTimeout(holdTimer);
    exitBtn.classList.remove('opacity-75');
  }
</script></main>







</body></html>
