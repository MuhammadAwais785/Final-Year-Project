eight": "52px", "fontWeight": "800" }] } } } };</script><style>

  </head><body class="bg-surface text-on-surface flex flex-col min-h-screen relative antialiased"><header class="fixed top-0 inset-x-0 z-50 pt-safe bg-surface/40 backdrop-blur-md"><div class="h-6 px-margin flex items-center justify-between text-on-surface select-none"><span class="font-label-sm text-label-sm tracking-tight">09:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[18px]">battery_full</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-6 pb-6 bg-surface"><div class="flex flex-col w-full max-w-md mx-auto px-margin pb-space-lg select-none">
<!-- Top Navigation & Shield Status -->
<div class="flex items-center justify-between py-space-sm">
<button aria-label="Go back to Home / واپس جائیں" class="flex items-center gap-space-xs text-primary min-w-[48px] min-h-[48px] px-space-sm rounded-full bg-surface-container-low hover:bg-surface-container transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
<span class="font-label-md text-label-md">Back</span>
<span class="font-urdu-body-md text-urdu-body-md leading-none pt-0.5">/ واپس</span>
</button>
<div aria-hidden="true" class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
<!-- Symmetrical spacer for balance -->
<div aria-hidden="true" class="w-12 h-12"></div>
</div>
<!-- Security Header Titles -->
<div class="text-center mt-space-sm mb-space-md">
<h1 class="font-headline-md text-headline-md text-on-surface">Enter Parent PIN</h1>
<p class="font-urdu-headline-md text-urdu-headline-md text-primary mt-space-xs" dir="rtl">والدین کا پن کوڈ درج کریں</p>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mx-auto mt-space-xs">
      To keep child play safe, enter your 4-digit security code.
    </p>
</div>
<!-- PIN Indicators Module -->
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm flex flex-col items-center">
<div aria-label="2 of 4 digits entered" class="flex items-center justify-center gap-space-lg my-space-sm" role="status">
<!-- Dot 1: Filled -->
<div class="w-5 h-5 rounded-full bg-primary transition-all duration-200 shadow-sm scale-110" id="dot-1"></div>
<!-- Dot 2: Filled -->
<div class="w-5 h-5 rounded-full bg-primary transition-all duration-200 shadow-sm scale-110" id="dot-2"></div>
<!-- Dot 3: Active cursor/unfilled -->
<div class="w-5 h-5 rounded-full bg-surface-container-highest transition-all duration-200 ring-2 ring-primary/40 ring-offset-2 ring-offset-surface-container-lowest" id="dot-3"></div>
<!-- Dot 4: Unfilled -->
<div class="w-5 h-5 rounded-full bg-surface-container-highest transition-all duration-200" id="dot-4"></div>
</div>
<!-- Error State Message Banner (WCAG 2.2 AA compliant) -->
<div class="w-full mt-space-md bg-error-container text-on-error-container rounded-lg p-space-sm flex items-start gap-space-sm shadow-sm" role="alert">
<span class="material-symbols-outlined text-[20px] text-error flex-shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">warning</span>
<div class="flex-1 flex flex-col">
<span class="font-label-md text-label-md text-on-error-container">Incorrect PIN. 3 attempts left.</span>
<span class="font-urdu-body-md text-urdu-body-md text-on-error-container leading-tight mt-0.5" dir="rtl">غلط پن۔ 3 کوششیں باقی ہیں۔</span>
</div>
</div>
</div>
<!-- Numeric Touch Keypad (3x4 Grid, Oversized Targets) -->
<div class="mt-space-md bg-surface-container-low rounded-xl p-space-md shadow-sm">
<div class="grid grid-cols-3 gap-y-space-sm gap-x-space-md justify-items-center"><!-- 1 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="1" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">1</span></button>
<!-- 2 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="2" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">2</span></button>
<!-- 3 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="3" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">3</span></button>
<!-- 4 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="4" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">4</span></button>
<!-- 5 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="5" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">5</span></button>
<!-- 6 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="6" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">6</span></button>
<!-- 7 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="7" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">7</span></button>
<!-- 8 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="8" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">8</span></button>
<!-- 9 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="9" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">9</span></button>
<!-- Biometric Spacer (Position 10) -->
<div aria-hidden="true" class="w-[72px] h-[72px]"></div>
<!-- 0 -->
<button class="pin-key w-[72px] h-[72px] rounded-full bg-surface-container-lowest active:bg-surface-container-highest flex flex-col items-center justify-center shadow-sm text-on-surface transition-transform active:scale-95 focus:outline-none" data-val="0" type="button"><span class="font-headline-md text-[26px] leading-none text-on-surface font-bold">0</span></button>
<!-- Delete / Backspace (Position 12) -->
<button aria-label="Delete last digit / حذف کریں" class="w-[72px] h-[72px] rounded-full bg-surface-container active:bg-surface-container-high flex flex-col items-center justify-center text-on-surface-variant transition-transform active:scale-95 focus:outline-none" id="key-delete" type="button">
<span class="material-symbols-outlined text-[24px]">backspace</span>
<span class="font-label-sm text-label-sm font-semibold mt-1">Delete</span>
</button></div>
</div>
<!-- Auxiliary Recovery Actions -->
<div class="mt-space-md flex flex-col items-center gap-space-xs">
<button class="min-h-[48px] px-space-md flex items-center justify-center gap-space-xs text-primary hover:text-primary-container focus:outline-none group" type="button"><div class="flex flex-col items-center gap-space-xs text-center"><span class="font-label-md text-label-md underline decoration-primary/40 underline-offset-4 group-hover:decoration-primary">Forgot PIN? Reset with email &amp; password</span><span class="font-urdu-body-md text-urdu-body-md font-bold" dir="rtl">پن بھول گئے؟ ای میل اور پاس ورڈ سے ری سیٹ کریں</span></div></button>

</div>
</div>
<script>
  (() => {
    let pin = ['1', '2'];
    const maxDigits = 4;
    const dots = [
      document.getElementById('dot-1'),
      document.getElementById('dot-2'),
      document.getElementById('dot-3'),
      document.getElementById('dot-4')
    ];

    const renderDots = () => {
      dots.forEach((dot, idx) => {
        if (!dot) return;
        if (idx < pin.length) {
          dot.className = "w-5 h-5 rounded-full bg-primary transition-all duration-200 shadow-sm scale-110";
        } else if (idx === pin.length) {
          dot.className = "w-5 h-5 rounded-full bg-surface-container-highest transition-all duration-200 ring-2 ring-primary/40 ring-offset-2 ring-offset-surface-container-lowest";
        } else {
          dot.className = "w-5 h-5 rounded-full bg-surface-container-highest transition-all duration-200";
        }
      });
    };

    document.querySelectorAll('.pin-key').forEach(button => {
      button.addEventListener('click', () => {
        if (pin.length < maxDigits) {
          pin.push(button.dataset.val);
          renderDots();
        }
      });
    });

    const delBtn = document.getElementById('key-delete');
    if (delBtn) {
      delBtn.addEventListener('click', () => {
        if (pin.length > 0) {
          pin.pop();
          renderDots();
        }
      });
    }
  })();
</script></main><footer class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe"><div class="h-5 w-full flex items-center justify-center select-none"><div class="w-32 h-1 rounded-full bg-on-surface-variant/30"></div></div></footer>



</body></html>
