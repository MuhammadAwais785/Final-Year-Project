0" }] } } } };</script><style>

  </head><body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex flex-col"><h1 class="font-headline-sm text-headline-sm text-on-surface line-clamp-1">Add a child</h1></div></div><div class="flex items-center gap-space-sm"><button aria-label="Bilingual language selector" class="px-space-sm h-9 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center gap-space-xs transition-colors" type="button"><span class="material-symbols-outlined text-primary text-[18px]">translate</span><span class="font-label-sm text-label-sm text-on-surface">اردو / EN</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full">
<div class="px-margin py-space-md flex flex-col gap-space-lg">
<!-- Child Avatar Illustration Card -->
<div class="w-full bg-surface-container-lowest rounded-lg p-space-lg shadow-sm flex items-center gap-space-md">
<div class="relative w-16 h-16 rounded-full shrink-0 bg-surface-container flex items-center justify-center"><span class="material-symbols-outlined text-[32px] text-primary">face</span></div>
<div class="flex flex-col min-w-0">
<span class="font-label-lg text-label-lg text-on-surface">New Profile Setup</span>

</div>
</div>
<!-- Main Registration Form Container -->
<form class="w-full bg-surface-container-lowest rounded-lg p-space-lg shadow-sm flex flex-col gap-space-lg" onsubmit="event.preventDefault();">
<!-- 1. Name Field with Error -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="child-name-input">
            Child's name
          </label>

</div>
<div class="relative w-full rounded-[16px] bg-surface-container-low transition-all focus-within:bg-surface-container-lowest shadow-sm">
<input aria-describedby="name-field-error" aria-invalid="true" class="w-full h-14 px-space-md bg-transparent rounded-[16px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none" id="child-name-input" placeholder="e.g. Zaid" type="text" value="">
<div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-error">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
</div>
<!-- Inline Error -->
<div class="flex items-start gap-1.5 pt-1 text-error" id="name-field-error" role="alert">
<span class="material-symbols-outlined text-[16px] mt-0.5 shrink-0">report</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm leading-tight text-error">
              Please enter the child's name.
            </span>

</div>
</div>
</div>
<!-- 2. Age Selection -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface">
            Age (years)
          </label>

</div>
<!-- Touch-friendly Age Chips Grid -->
<div aria-label="Select age" class="grid grid-cols-5 gap-space-xs pt-1" role="radiogroup">
<!-- Age 3 -->
<button aria-checked="false" class="h-14 rounded-2xl bg-surface-container-low text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-all active:scale-95 shadow-sm" role="radio" type="button">
            3
          </button>
<!-- Age 4 (Selected) -->
<button aria-checked="true" class="h-14 rounded-2xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center shadow-md shadow-primary/20 scale-100" role="radio" type="button">
            4
          </button>
<!-- Age 5 -->
<button aria-checked="false" class="h-14 rounded-2xl bg-surface-container-low text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-all active:scale-95 shadow-sm" role="radio" type="button">
            5
          </button>
<!-- Age 6 -->
<button aria-checked="false" class="h-14 rounded-2xl bg-surface-container-low text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-all active:scale-95 shadow-sm" role="radio" type="button">
            6
          </button>
<!-- Age 7 -->
<button aria-checked="false" class="h-14 rounded-2xl bg-surface-container-low text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-all active:scale-95 shadow-sm" role="radio" type="button">
            7
          </button>
</div>
</div>
<!-- 3. Language Selection -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface">
            Language
          </label>

</div>
<div aria-label="Language selection" class="grid grid-cols-2 gap-space-sm pt-1" role="radiogroup">
<!-- English (Unselected) -->
<button aria-checked="false" class="h-14 px-space-md rounded-2xl bg-surface-container-low text-on-surface flex items-center justify-center gap-space-xs transition-all active:scale-98 shadow-sm" role="radio" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">language</span>
<span class="font-label-md text-label-md">English</span>
</button>
<!-- Urdu (Selected) -->
<button aria-checked="true" class="h-14 px-space-md rounded-2xl bg-primary text-on-primary flex items-center justify-center gap-space-xs shadow-md shadow-primary/20" role="radio" type="button">
<span class="material-symbols-outlined text-[20px] text-on-primary">check_circle</span>
<span class="font-urdu-headline-sm text-urdu-headline-md leading-none pt-1">اردو</span>
</button>
</div>
</div>
<!-- 4. Save Profile Button -->
<div class="pt-space-sm flex flex-col gap-space-xs">
<button class="w-full h-14 rounded-2xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-md shadow-primary/25 active:scale-[0.98] transition-transform" type="submit"><span class="material-symbols-outlined text-[22px]">save</span><span>Save profile</span></button>
</div>
</form>
</div>
</div>
<script>
  // Accessible radio toggle interactions for Age and Language chips
  document.querySelectorAll('[role="radiogroup"]').forEach(group => {
    const buttons = group.querySelectorAll('button[role="radio"]');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.setAttribute('aria-checked', 'false');
          b.classList.remove('bg-primary', 'text-on-primary', 'shadow-md', 'shadow-primary/20', 'shadow-primary/25');
          b.classList.add('bg-surface-container-low', 'text-on-surface', 'shadow-sm');
          
          const icon = b.querySelector('.material-symbols-outlined');
          if (icon && icon.textContent === 'check_circle') {
            icon.textContent = 'language';
            icon.classList.remove('text-on-primary');
            icon.classList.add('text-on-surface-variant');
          }
        });

        btn.setAttribute('aria-checked', 'true');
        btn.classList.remove('bg-surface-container-low', 'text-on-surface', 'shadow-sm');
        btn.classList.add('bg-primary', 'text-on-primary', 'shadow-md', 'shadow-primary/20');
        
        const activeIcon = btn.querySelector('.material-symbols-outlined');
        if (activeIcon && activeIcon.textContent === 'language') {
          activeIcon.textContent = 'check_circle';
          activeIcon.classList.remove('text-on-surface-variant');
          activeIcon.classList.add('text-on-primary');
        }
      });
    });
  });
</script></main>

</body></html>
