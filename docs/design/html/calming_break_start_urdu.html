<!DOCTYPE html><html class="h-full" dir="rtl" lang="ur"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#FFF8F0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "cream": "#FFF8F0", "lavender-soft": "#EBE8F9", "lavender-border": "#DDD6FE", "lavender-text": "#5B527E", "sky-soft": "#E0F2FE", "sky-accent": "#38BDF8", "sky-deep": "#0284C7", "calm-text": "#2D3142" }, "fontFamily": { "urdu": ["Noto Nastaliq Urdu", "serif"], "sans": ["Plus Jakarta Sans", "sans-serif"] } } } }</script></head><body class="bg-[#FFF8F0] min-h-screen text-[#2D3142] antialiased flex flex-col selection:bg-lavender-soft font-urdu"><main class="flex-1 flex flex-col relative w-full bg-[#FFF8F0] pt-safe pb-safe min-h-screen justify-between"><div class="flex flex-col w-full px-5 py-4 flex-1 justify-between max-w-md mx-auto" dir="rtl">
<!-- Top Bar: Soft Ambient Status Pill Only (No Home button, No Stars counter) -->
<header class="w-full flex items-center justify-center py-2 select-none">
<div class="px-4 py-1.5 rounded-full bg-[#EBE8F9]/80 border border-[#DDD6FE]/60 flex items-center gap-2 shadow-xs">
<span class="w-2.5 h-2.5 rounded-full bg-sky-accent animate-pulse"></span>
<span class="font-urdu text-[15px] leading-relaxed text-lavender-text font-medium pt-1">پرسکون وقت</span>
</div>
</header>
<!-- Main Visual Content Area -->
<div class="relative w-full flex flex-col items-center justify-center flex-grow py-2">
<!-- Gentle Sky-Blue / Lavender Ambient Soundwaves / Breeze in Background -->
<div class="absolute -top-4 inset-x-0 h-56 pointer-events-none opacity-30 flex items-center justify-center -z-10">
<svg class="w-full h-full text-sky-deep/20" fill="none" viewBox="0 0 300 200">
<path d="M 20 100 Q 80 40 150 100 T 280 100" opacity="0.4" stroke="currentColor" stroke-linecap="round" stroke-width="20"></path>
<path d="M 40 120 Q 90 70 160 110 T 260 115" opacity="0.3" stroke="#A78BFA" stroke-linecap="round" stroke-width="14"></path>
</svg>
</div>
<!-- Therapeutic Speech Bubble with Nastaliq font -->
<div class="relative z-10 w-full max-w-xs mb-1">
<div class="relative bg-white/90 backdrop-blur-xs border border-lavender-border/50 rounded-2xl p-4 shadow-sm text-center flex items-center justify-center gap-3">
<!-- Replay Speaker Button with Soft Sky/Lavender Accent -->
<button aria-label="آواز سنیں" class="w-11 h-11 rounded-full bg-sky-soft text-sky-deep flex-shrink-0 flex items-center justify-center active:scale-90 transition-transform shadow-xs" id="audio-replay-btn" type="button">
<span class="material-symbols-outlined text-[22px]">volume_up</span>
</button>
<!-- Urdu Nastaliq Speech Prompt -->
<p class="font-urdu text-[21px] leading-[2.2] text-[#2D3142] font-semibold flex-1 text-center m-0 pt-1">
          آئیں تھوڑا آرام کرتے ہیں
        </p>
<!-- Soft Lavender Decorative Icon -->
<span class="material-symbols-outlined text-[#8B7AC8] text-[20px] opacity-80" style="font-variation-settings: 'FILL' 1;">spa</span>
<!-- Right-directed RTL Tail pointing directly to Doctor Character -->
<div class="absolute -bottom-2.5 right-12 w-5 h-5 bg-white border-b border-l border-lavender-border/50 rotate-[-45deg] rounded-xs pointer-events-none"></div>
</div>
</div>
<!-- Isolated Doctor Character with NO Box, NO White Frame, Placed Directly on #FFF8F0 -->
<div class="relative w-full max-w-[290px] aspect-square flex items-center justify-center select-none z-0">
<img alt="ڈاکٹر دوست" class="w-full h-full object-contain pointer-events-none drop-shadow-none filter-none bg-transparent" src="../assets/doctor.png">
</div>
<!-- Interactive Large Soft Call-to-Action Pill Button -->
<div class="w-full max-w-xs flex flex-col items-center gap-3 z-10 mt-1">
<button class="w-full min-h-[72px] h-[74px] rounded-full bg-gradient-to-r from-[#2B7A78] to-[#176664] text-white flex items-center justify-center gap-3 px-6 shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-150 cursor-pointer overflow-hidden group relative" id="rest-action-button" type="button">
<span class="w-11 h-11 rounded-full bg-white/20 flex items-center justify-center text-white group-active:scale-95 transition-transform flex-shrink-0">
<span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</span>
<span class="font-urdu text-[22px] leading-loose font-bold text-white tracking-wide pt-1">آئیں سانس لیتے ہیں</span>
</button>
<!-- Soft Guided Breathing Cue (Lavender & Sky Accent) -->
<div class="flex items-center gap-2 text-lavender-text px-4 py-1.5 bg-[#EBE8F9]/60 border border-[#DDD6FE]/40 rounded-full">
<span class="material-symbols-outlined text-[17px] text-sky-deep">air</span>
<span class="font-urdu text-[14px] leading-loose text-lavender-text font-medium pt-0.5">لمبا اور ہلکا سانس لیں</span>
</div>
</div>
</div>
<!-- Bottom Single Parental Quiet Exit (Lock Icon & Hold to Exit) -->
<footer class="w-full pt-4 pb-2 flex flex-col items-center justify-center select-none">
<button class="group relative inline-flex items-center justify-center gap-2.5 px-6 py-2 rounded-full bg-white/70 border border-lavender-border/40 text-[#5B527E] shadow-2xs active:bg-lavender-soft transition-colors overflow-hidden" id="parent-hold-exit" type="button">
<div class="absolute inset-0 rounded-full bg-sky-soft/60 origin-right scale-x-0 transition-transform pointer-events-none" id="hold-progress"></div>
<span class="material-symbols-outlined text-[18px] text-[#71787F] group-hover:text-sky-deep transition-colors">lock</span>
<span class="font-urdu text-[14px] leading-loose text-lavender-text font-medium pt-1">
        والدین: باہر نکلنے کے لیے دبا کر رکھیں
      </span>
</button>
</footer>
</div>
<script>
  (function initCalmRTLScreen() {
    const playBtn = document.getElementById('rest-action-button');
    const audioBtn = document.getElementById('audio-replay-btn');
    const parentExit = document.getElementById('parent-hold-exit');
    const holdProgress = document.getElementById('hold-progress');

    if (audioBtn) {
      audioBtn.addEventListener('click', () => {
        audioBtn.classList.add('scale-110');
        setTimeout(() => audioBtn.classList.remove('scale-110'), 250);
      });
    }

    if (playBtn) {
      playBtn.addEventListener('click', () => {
        playBtn.classList.add('brightness-110');
        setTimeout(() => playBtn.classList.remove('brightness-110'), 300);
      });
    }

    if (parentExit && holdProgress) {
      let holdTimer = null;
      const startHold = () => {
        holdProgress.style.transition = 'transform 1.2s ease-out';
        holdProgress.style.transform = 'scaleX(1)';
        holdTimer = setTimeout(() => {
          const modalTrigger = document.querySelector('[data-path="parental-gate-modal"]');
          if (modalTrigger) modalTrigger.click();
        }, 1200);
      };

      const cancelHold = () => {
        clearTimeout(holdTimer);
        holdProgress.style.transition = 'transform 0.2s ease-in';
        holdProgress.style.transform = 'scaleX(0)';
      };

      parentExit.addEventListener('mousedown', startHold);
      parentExit.addEventListener('touchstart', startHold, { passive: true });
      parentExit.addEventListener('mouseup', cancelHold);
      parentExit.addEventListener('mouseleave', cancelHold);
      parentExit.addEventListener('touchend', cancelHold);
    }
  })();
</script></main>

</body></html>
