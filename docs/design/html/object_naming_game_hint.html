<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#7dd7bc", "inverse-primary": "#90cef9", "secondary-fixed": "#ffdbca", "on-error": "#ffffff", "on-tertiary-fixed-variant": "#005140", "inverse-on-surface": "#eff0ff", "surface-container-high": "#e4e7fe", "primary-fixed": "#c8e6ff", "surface-container-lowest": "#ffffff", "outline": "#71787f", "on-tertiary-fixed": "#002018", "on-secondary-fixed-variant": "#763302", "on-primary-fixed": "#001e2e", "on-background": "#171b2b", "on-primary-fixed-variant": "#004c6d", "on-primary-container": "#fcfcff", "tertiary": "#006954", "surface": "#faf8ff", "primary-fixed-dim": "#90cef9", "secondary-fixed-dim": "#ffb68e", "primary-container": "#397ba3", "on-surface": "#171b2b", "secondary-container": "#fe9e67", "outline-variant": "#c0c7cf", "tertiary-fixed": "#99f4d7", "on-tertiary-container": "#f5fff9", "error": "#ba1a1a", "surface-variant": "#dee1f8", "surface-container-highest": "#dee1f8", "surface-dim": "#d6d9ef", "on-primary": "#ffffff", "on-secondary-container": "#773403", "tertiary-container": "#1f836b", "background": "#faf8ff", "on-secondary": "#ffffff", "inverse-surface": "#2c3041", "surface-tint": "#1c648b", "surface-bright": "#faf8ff", "on-surface-variant": "#40484e", "error-container": "#ffdad6", "secondary": "#944a1a", "on-secondary-fixed": "#331200", "primary": "#186288", "surface-container": "#ebedff", "surface-container-low": "#f3f2ff", "on-error-container": "#93000a" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-md": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "space-xl": "2.25rem", "space-sm": "0.5rem", "margin": "1.25rem" }, fontFamily: { "urdu-body-md": ["Noto Nastaliq Urdu"], "urdu-headline-md": ["Noto Nastaliq Urdu"], "label-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "urdu-body-lg": ["Noto Nastaliq Urdu"], "body-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "urdu-headline-lg": ["Noto Nastaliq Urdu"], "headline-lg": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"] }, fontSize: { "urdu-body-md": ["15px", { "lineHeight": "34px", "fontWeight": "400" }], "urdu-headline-md": ["22px", { "lineHeight": "48px", "fontWeight": "700" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "52px", "fontWeight": "800" }], "urdu-body-lg": ["18px", { "lineHeight": "40px", "fontWeight": "500" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "urdu-headline-lg": ["26px", { "lineHeight": "54px", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } }</script><style>@layer base { html, body { width: 100vw; min-height: 100%; margin: 0; padding: 0; } body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } .pr-safe { padding-right: env(safe-area-inset-right, 0px); } .pl-safe { padding-left: env(safe-area-inset-left, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; } .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style></head><body class="bg-surface text-on-surface font-body-md text-body-md select-none touch-manipulation" style="background-color: rgb(255, 248, 240);"><main class="relative w-full min-h-screen flex flex-col pt-safe pb-safe pr-safe pl-safe px-margin"><div class="flex flex-col w-full pb-6 space-y-4">
<!-- Top Bar -->
<header class="flex items-center justify-between w-full h-14 px-2">
<!-- Home Button (Child Touch Target >= 48dp) -->
<button aria-label="Go Home" class="w-12 h-12 rounded-full bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[28px]">home</span>
</button>
<!-- 6 Progress Dots (2 filled, 4 unfilled) -->
<div class="flex items-center space-x-2"><span class="w-3.5 h-3.5 rounded-full bg-primary shadow-xs"></span><span class="w-3.5 h-3.5 rounded-full bg-primary shadow-xs"></span><span class="w-3.5 h-3.5 rounded-full bg-primary-fixed"></span><span class="w-3.5 h-3.5 rounded-full bg-primary-fixed"></span><span class="w-3.5 h-3.5 rounded-full bg-primary-fixed"></span><span class="w-3.5 h-3.5 rounded-full bg-primary-fixed"></span></div>
<!-- Star Counter: 1 star icon & "12" -->
<div class="flex items-center space-x-1.5 bg-surface-container-lowest px-3.5 py-1.5 rounded-full shadow-sm"><span class="material-symbols-outlined text-secondary-container text-[24px]" style="font-variation-settings: &quot;FILL&quot; 1;">star</span><span class="font-headline-sm text-headline-sm text-on-surface leading-none">12</span></div>
</header>
<!-- Large White Rounded Card -->
<section class="w-full bg-surface-container-lowest rounded-xl p-6 shadow-sm flex flex-col items-center justify-center relative">
<!-- Apple Object Image -->
<div class="relative w-48 h-48 mx-auto flex items-center justify-center"><img alt="apple" class="w-48 h-48 mx-auto object-contain" src="../assets/apple.png"><button aria-label="Replay sound" class="absolute top-1 right-1 w-10 h-10 rounded-full bg-surface-container text-primary shadow-sm flex items-center justify-center active:scale-95 transition-transform duration-150" type="button"><span class="material-symbols-outlined text-[24px]">volume_up</span></button></div>
<!-- Bilingual Object Label -->
<div class="flex flex-col items-center mt-3 text-center">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-wide">apple</span>
<span class="font-urdu-headline-md text-urdu-headline-md text-on-surface-variant mt-0.5">سیب</span>
</div>
<!-- Hint Sound Bar / Pulsing Listening Mic (Oversized touch target >= 72dp) -->
<div class="mt-4 flex flex-col items-center">
<button aria-label="Listen and speak" class="relative w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center shadow-md active:scale-95 transition-transform duration-200" type="button">
<!-- Ambient Breathing Halo -->
<span class="absolute inset-0 rounded-full bg-primary-fixed-dim opacity-60 animate-ping"></span>
<span class="material-symbols-outlined text-primary text-[36px] relative z-10" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<!-- Gentle Soundwave Hint Bars -->
<div class="flex items-center space-x-1.5 mt-3 h-5">
<span class="w-1.5 h-2.5 bg-primary-container/40 rounded-full animate-pulse"></span>
<span class="w-1.5 h-4.5 bg-primary-container/70 rounded-full animate-pulse" style="animation-delay: 150ms;"></span>
<span class="w-1.5 h-3 bg-primary-container rounded-full animate-pulse" style="animation-delay: 300ms;"></span>
<span class="w-1.5 h-5 bg-primary-container/80 rounded-full animate-pulse" style="animation-delay: 75ms;"></span>
<span class="w-1.5 h-2 bg-primary-container/40 rounded-full animate-pulse" style="animation-delay: 200ms;"></span>
</div>
</div>
</section>
<!-- Doctor & Hint Speech Bubble -->
<section class="w-full flex items-center px-1 pt-1 space-x-3">
<!-- Doctor Character (Directly on screen canvas, no container) -->
<div class="flex-shrink-0"><img alt="Doctor" class="w-20 h-20 object-contain" src="../assets/doctor.png" style="background: transparent;"></div>
<!-- Accented Playful Hint Speech Bubble -->
<div class="relative flex-1 bg-secondary-fixed text-on-secondary-fixed rounded-lg p-3.5 shadow-sm flex items-center space-x-2.5">
<!-- Chat Bubble Tail -->
<div class="absolute -left-2 top-1/2 -translate-y-1/2 w-0 h-0 border-t-[8px] border-t-transparent border-b-[8px] border-b-transparent border-r-[10px] border-r-secondary-fixed"></div>
<!-- Glowing Lightbulb Icon -->
<div class="w-9 h-9 rounded-full bg-surface-container-lowest flex items-center justify-center flex-shrink-0 shadow-xs">
<span class="material-symbols-outlined text-secondary text-[22px]" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<!-- Hint Text -->
<p class="font-body-lg text-body-lg font-semibold text-on-secondary-fixed-variant leading-tight">
        It starts with 'a'
      </p>
</div>
</section>
<!-- Bottom Parental Exit Lock -->
<footer class="w-full flex justify-center pt-2">
<button aria-label="Grown-ups hold to exit" class="flex items-center space-x-2 bg-surface-container px-4 py-2 rounded-full text-on-surface-variant/80 active:bg-surface-variant transition-colors duration-150" type="button">
<span class="material-symbols-outlined text-[18px]">lock</span>
<span class="font-label-sm text-label-sm">Grown-ups: hold to exit</span>
</button>
</footer>
</div></main>





</body></html>
