<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#FFF8F0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "cream": "#FFF8F0", "surface-container-lowest": "#ffffff", "on-tertiary-fixed": "#002018", "tertiary": "#006954", "secondary": "#944a1a", "inverse-primary": "#90cef9", "on-primary-container": "#fcfcff", "primary": "#186288", "on-error": "#ffffff", "on-tertiary-container": "#f5fff9", "surface-variant": "#dee1f8", "on-primary-fixed-variant": "#004c6d", "inverse-on-surface": "#eff0ff", "on-secondary-fixed": "#331200", "primary-fixed-dim": "#90cef9", "surface-dim": "#d6d9ef", "on-secondary": "#ffffff", "on-surface-variant": "#5a6275", "surface": "#FFF8F0", "outline": "#71787f", "surface-container-high": "#e4e7fe", "on-secondary-fixed-variant": "#763302", "on-secondary-container": "#773403", "on-primary-fixed": "#001e2e", "on-surface": "#171b2b", "primary-container": "#397ba3", "background": "#FFF8F0", "inverse-surface": "#2c3041", "on-error-container": "#93000a", "on-tertiary": "#ffffff", "tertiary-fixed": "#99f4d7", "surface-bright": "#FFF8F0", "secondary-fixed": "#ffdbca", "surface-container": "#f3ecdf", "on-background": "#171b2b", "surface-container-highest": "#dee1f8", "primary-fixed": "#c8e6ff", "tertiary-container": "#1f836b", "secondary-fixed-dim": "#ffb68e", "error-container": "#ffdad6", "secondary-container": "#fe9e67", "on-primary": "#ffffff", "surface-container-low": "#faf3ea", "outline-variant": "#c0c7cf", "on-tertiary-fixed-variant": "#005140", "error": "#ba1a1a", "tertiary-fixed-dim": "#7dd7bc", "surface-tint": "#1c648b" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "gutter": "1rem", "space-xs": "0.25rem", "margin": "1.25rem", "space-xl": "2.25rem", "space-lg": "1.5rem", "space-sm": "0.5rem" }, "fontFamily": { "urdu-body-md": ["Noto Nastaliq Urdu"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "urdu-body-lg": ["Noto Nastaliq Urdu"], "label-lg": ["Plus Jakarta Sans"], "urdu-headline-md": ["Noto Nastaliq Urdu"], "body-sm": ["Plus Jakarta Sans"], "urdu-headline-lg": ["Noto Nastaliq Urdu"], "body-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"] }, "fontSize": { "urdu-body-md": ["15px", { "lineHeight": "34px", "fontWeight": "400" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "52px", "fontWeight": "800" }], "urdu-body-lg": ["18px", { "lineHeight": "40px", "fontWeight": "500" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "urdu-headline-md": ["22px", { "lineHeight": "48px", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "urdu-headline-lg": ["26px", { "lineHeight": "54px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }] } } } }</script></head><body class="bg-[#FFF8F0] min-h-screen text-on-surface antialiased flex flex-col selection:bg-secondary-fixed"><main class="flex-1 flex flex-col justify-between relative w-full bg-[#FFF8F0] pt-safe pb-safe"><div class="flex flex-col flex-1 justify-between w-full px-margin pb-space-lg pt-space-lg">
<!-- Central Sanctuary: Doctor character & Conversational Speech Bubble -->
<div class="flex flex-col items-center justify-center flex-1 w-full my-auto">
<!-- Friendly Speech Bubble pointing down-center towards Doctor -->
<div class="relative bg-white/90 backdrop-blur-sm px-space-lg py-space-md rounded-2xl shadow-[0_6px_20px_rgba(45,49,66,0.05)] border border-sky-100/60 max-w-[290px] text-center mb-space-sm">
<p class="font-headline-sm text-headline-sm text-on-surface leading-snug">
        Let's take a calm break
      </p>
<!-- Speech bubble tail pointing towards character -->
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-white/90 rotate-45 border-r border-b border-sky-100/60"></div>
</div>
<!-- Doctor Character with NO background box/border/shadow square -->
<div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
<img alt="Friendly doctor character waving hello" class="w-full h-full object-contain pointer-events-none drop-shadow-[0_12px_28px_rgba(24,98,136,0.12)]" src="../assets/doctor.png">
</div>
</div>
<!-- Primary Restful Action Island -->
<div class="w-full flex flex-col items-center gap-space-md mt-auto">
<button class="w-full h-[72px] rounded-full bg-[#dbeefd] hover:bg-[#cbe8fd] active:scale-[0.99] text-[#0f4d6d] shadow-[0_8px_20px_rgba(144,206,249,0.25)] border border-[#bfe2fb] flex items-center justify-center gap-space-sm transition-all duration-200" type="button">
<span class="material-symbols-outlined text-[28px] text-[#186288]">spa</span>
<span class="font-label-lg text-label-lg tracking-wide font-bold">Let's breathe</span>
</button>
<!-- Subtle Parental Hold Mechanism -->
<div class="flex flex-col items-center w-full pt-space-xs">
<button class="group flex items-center gap-space-xs px-space-md py-space-xs rounded-full text-on-surface-variant/80 hover:text-on-surface bg-transparent transition-all select-none" id="adult-hold-btn" type="button">
<span class="material-symbols-outlined text-[17px] opacity-70">lock</span>
<span class="font-label-sm text-label-sm font-medium">Grown-ups: hold to exit</span>
</button>
<!-- Subtle Visual Hold Feedback Indicator -->
<div class="w-24 h-1 rounded-full bg-[#eee5d8] mt-1.5 overflow-hidden opacity-0 transition-opacity" id="hold-progress">
<div class="w-0 h-full bg-[#186288] transition-all duration-75" id="hold-bar"></div>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const btn = document.getElementById('adult-hold-btn');
    const bar = document.getElementById('hold-bar');
    const container = document.getElementById('hold-progress');
    let timer = null;
    let progress = 0;

    function startHold(e) {
      if (e.cancelable) e.preventDefault();
      container.classList.remove('opacity-0');
      progress = 0;
      timer = setInterval(() => {
        progress += 4;
        bar.style.width = Math.min(progress, 100) + '%';
        if (progress >= 100) {
          clearInterval(timer);
          bar.style.width = '100%';
          // Soft feedback simulation
          setTimeout(() => {
            container.classList.add('opacity-0');
            bar.style.width = '0%';
          }, 300);
        }
      }, 30);
    }

    function cancelHold() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      container.classList.add('opacity-0');
      bar.style.width = '0%';
    }

    if (btn) {
      btn.addEventListener('mousedown', startHold);
      btn.addEventListener('touchstart', startHold, { passive: false });
      btn.addEventListener('mouseup', cancelHold);
      btn.addEventListener('mouseleave', cancelHold);
      btn.addEventListener('touchend', cancelHold);
      btn.addEventListener('touchcancel', cancelHold);
    }
  })();
</script></main>

</body></html>
