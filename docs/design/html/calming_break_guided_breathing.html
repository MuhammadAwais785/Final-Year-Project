<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#FFF8F0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-lowest": "#ffffff", "on-tertiary-fixed": "#002018", "tertiary": "#006954", "secondary": "#944a1a", "inverse-primary": "#90cef9", "on-primary-container": "#fcfcff", "primary": "#186288", "on-error": "#ffffff", "on-tertiary-container": "#f5fff9", "surface-variant": "#dee1f8", "on-primary-fixed-variant": "#004c6d", "inverse-on-surface": "#eff0ff", "on-secondary-fixed": "#331200", "primary-fixed-dim": "#90cef9", "surface-dim": "#d6d9ef", "on-secondary": "#ffffff", "on-surface-variant": "#40484e", "surface": "#FAF8FF", "outline": "#71787f", "surface-container-high": "#e4e7fe", "on-secondary-fixed-variant": "#763302", "on-secondary-container": "#773403", "on-primary-fixed": "#001e2e", "on-surface": "#171b2b", "primary-container": "#397ba3", "background": "#FAF8FF", "inverse-surface": "#2c3041", "on-error-container": "#93000a", "on-tertiary": "#ffffff", "tertiary-fixed": "#99f4d7", "surface-bright": "#faf8ff", "secondary-fixed": "#ffdbca", "surface-container": "#ebedff", "on-background": "#171b2b", "surface-container-highest": "#dee1f8", "primary-fixed": "#c8e6ff", "tertiary-container": "#1f836b", "secondary-fixed-dim": "#ffb68e", "error-container": "#ffdad6", "secondary-container": "#fe9e67", "on-primary": "#ffffff", "surface-container-low": "#f3f2ff", "outline-variant": "#c0c7cf", "on-tertiary-fixed-variant": "#005140", "error": "#ba1a1a", "tertiary-fixed-dim": "#7dd7bc", "surface-tint": "#1c648b", "cream": "#FFF8F0" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "gutter": "1rem", "space-xs": "0.25rem", "margin": "1.25rem", "space-xl": "2.25rem", "space-lg": "1.5rem", "space-sm": "0.5rem" }, "fontFamily": { "urdu-body-md": ["Noto Nastaliq Urdu"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "urdu-body-lg": ["Noto Nastaliq Urdu"], "label-lg": ["Plus Jakarta Sans"], "urdu-headline-md": ["Noto Nastaliq Urdu"], "body-sm": ["Plus Jakarta Sans"], "urdu-headline-lg": ["Noto Nastaliq Urdu"], "body-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"] }, "fontSize": { "urdu-body-md": ["15px", { "lineHeight": "34px", "fontWeight": "400" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "52px", "fontWeight": "800" }], "urdu-body-lg": ["18px", { "lineHeight": "40px", "fontWeight": "500" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "urdu-headline-md": ["22px", { "lineHeight": "48px", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "urdu-headline-lg": ["26px", { "lineHeight": "54px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }] } } } }</script></head><body class="min-h-screen text-on-surface antialiased flex flex-col selection:bg-secondary-fixed bg-[#FFF8F0]"><main class="flex-1 flex flex-col justify-between items-center relative w-full bg-[#FFF8F0] pt-safe pb-safe min-h-screen"><div class="flex-1 flex flex-col justify-between items-center w-full relative px-margin py-space-lg select-none">
<!-- Centered Calming Breathing Activity Zone -->
<div class="w-full flex-1 flex flex-col items-center justify-center my-auto relative">
<!-- Gentle Ambient Glow Field -->
<div class="relative w-72 h-72 sm:w-80 sm:h-80 flex items-center justify-center">
<!-- Animated Breathing Sphere Halo (Pulsing rhythm 4s in, 4s out) -->
<div class="absolute inset-0 rounded-full bg-surface-variant/40 transition-all duration-[4000ms] ease-in-out scale-90 opacity-40" id="breath-outer-glow" style="transform: scale(1.18); opacity: 0.7;"></div>
<!-- Secondary Lavender/Sky Soothing Layer -->
<div class="absolute w-64 h-64 sm:w-72 sm:h-72 rounded-full bg-primary-fixed/40 transition-all duration-[4000ms] ease-in-out scale-95" id="breath-mid-glow" style="transform: scale(1.08);"></div>
<!-- Core Interactive Visual Breathing Sphere -->
<div class="relative z-10 w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-surface-container-lowest shadow-[0_8px_32px_rgba(45,49,66,0.06)] flex flex-col items-center justify-center text-center p-space-md transition-all duration-[4000ms] ease-in-out" id="breath-core" style="transform: scale(1.06);">
<span class="material-symbols-outlined text-primary-fixed-variant/40 text-[28px] mb-space-xs transition-opacity duration-700" id="breath-icon" style="opacity: 0.8;">air</span>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight transition-opacity duration-700" id="breath-text">Breathe in…</span>
</div>
</div>
<!-- Friendly Guide Doctor (Isolated directly on cream background, no boxes or borders) -->
<div class="w-full max-w-[260px] -mt-space-md flex justify-center items-center pointer-events-none relative z-20">
<img alt="Friendly doctor character guiding breathing exercise" class="w-full h-auto object-contain drop-shadow-[0_12px_24px_rgba(45,49,66,0.08)] bg-transparent" src="../assets/doctor.png">
</div>
</div>
<!-- Single Grown-up Long-Press Exit Control at the bottom -->
<footer class="w-full flex flex-col items-center justify-center pt-space-md pb-space-sm">
<div class="group relative overflow-hidden h-14 px-space-xl rounded-full bg-surface-container-high/70 text-on-surface-variant flex items-center justify-center gap-2 shadow-[0_4px_16px_rgba(45,49,66,0.05)] cursor-pointer select-none active:scale-[0.98] transition-transform" id="exit-btn" role="button" tabindex="0">
<!-- Fill gauge indicating long-press progress -->
<div class="absolute inset-0 bg-primary/20 origin-left scale-x-0 transition-transform duration-75" id="exit-progress"></div>
<span class="material-symbols-outlined text-[20px] relative z-10 text-on-surface-variant">lock</span>
<span class="font-label-md text-label-md font-semibold relative z-10 text-on-surface-variant">Grown-ups: hold to exit</span>
</div>
</footer>
</div>
<script>
  (function() {
    // Gentle 8-second cyclical guided respiration
    const outer = document.getElementById('breath-outer-glow');
    const mid = document.getElementById('breath-mid-glow');
    const core = document.getElementById('breath-core');
    const text = document.getElementById('breath-text');
    const icon = document.getElementById('breath-icon');

    let isInhaling = true;

    function runBreathingCycle() {
      if (isInhaling) {
        // Expand and soothe
        if (outer) outer.style.transform = 'scale(1.18)';
        if (outer) outer.style.opacity = '0.7';
        if (mid) mid.style.transform = 'scale(1.08)';
        if (core) core.style.transform = 'scale(1.06)';
        if (text) text.textContent = 'Breathe in…';
        if (icon) icon.style.opacity = '0.8';
      } else {
        // Contract and release
        if (outer) outer.style.transform = 'scale(0.88)';
        if (outer) outer.style.opacity = '0.25';
        if (mid) mid.style.transform = 'scale(0.92)';
        if (core) core.style.transform = 'scale(0.95)';
        if (text) text.textContent = 'Breathe out…';
        if (icon) icon.style.opacity = '0.35';
      }
      isInhaling = !isInhaling;
    }

    // Initialize cycle
    runBreathingCycle();
    setInterval(runBreathingCycle, 4000);

    // Grown-up Hold to Exit Logic
    const exitBtn = document.getElementById('exit-btn');
    const exitProgress = document.getElementById('exit-progress');
    let pressTimer = null;
    const requiredHoldTime = 1500;

    function startHold(e) {
      if (exitProgress) {
        exitProgress.style.transitionDuration = `${requiredHoldTime}ms`;
        exitProgress.style.transform = 'scaleX(1)';
      }
      pressTimer = setTimeout(() => {
        window.location.hash = 'parental-gate-modal';
      }, requiredHoldTime);
    }

    function cancelHold() {
      clearTimeout(pressTimer);
      if (exitProgress) {
        exitProgress.style.transitionDuration = '200ms';
        exitProgress.style.transform = 'scaleX(0)';
      }
    }

    if (exitBtn) {
      exitBtn.addEventListener('mousedown', startHold);
      exitBtn.addEventListener('touchstart', startHold, { passive: true });
      exitBtn.addEventListener('mouseup', cancelHold);
      exitBtn.addEventListener('mouseleave', cancelHold);
      exitBtn.addEventListener('touchend', cancelHold);
      exitBtn.addEventListener('touchcancel', cancelHold);
    }
  })();
</script></main>

</body></html>
